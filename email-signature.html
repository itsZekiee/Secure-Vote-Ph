<!DOCTYPE html>
<html>
<head>
<style>
  .signature-container {
    font-family: Arial, sans-serif;
    color: #333333;
    line-height: 1.5;
  }
  .signature-table {
    border-collapse: collapse;
  }
  .logo-cell {
    padding-right: 20px;
    border-right: 2px solid #004d40;
  }
  .info-cell {
    padding-left: 20px;
  }
  .name {
    font-size: 18px;
    font-weight: bold;
    color: #004d40;
    margin: 0;
  }
  .company {
    font-size: 14px;
    font-weight: bold;
    color: #555555;
    margin: 2px 0 10px 0;
  }
  .contact-info {
    font-size: 13px;
    color: #666666;
    margin: 2px 0;
    text-decoration: none;
  }
  .contact-info a {
    color: #004d40;
    text-decoration: none;
  }
  .logo-img {
    width: 100px;
    height: 100px;
    display: block;
    object-fit: contain;
  }
</style>
</head>
<body>

<div class="signature-container">
  <table class="signature-table">
    <tr>
      <td class="logo-cell">
        <!-- Replace the src with your hosted logo URL -->
        <img src="https://i.ibb.co/vzB6L4y/z-developers-logo.png" alt="Z Developers Logo" class="logo-img">
      </td>
      <td class="info-cell">
        <p class="name">Niel Ezequiel Dungao</p>
        <p class="company">Z Developers Ph</p>

        <p class="contact-info">
          Email: <a href="mailto:habee2004@gmail.com">habee2004@gmail.com</a>
        </p>
        <p class="contact-info">
          Phone: <a href="tel:+639652012720">(+63) 965 201 2720</a>
        </p>
      </td>
    </tr>
  </table>
</div>

</body>
</html>
